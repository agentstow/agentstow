name: deploy-site

# Publishes site/ to Cloudflare when it changes on main.
#
# This is deliberately GitHub Actions rather than Cloudflare's own Workers
# Builds. Connecting a repo to Workers Builds is dashboard-only — it runs
# through the GitHub App install flow, and neither wrangler, the cf CLI nor the
# REST API exposes a way to do it (verified 2026-08-13; see site/DEPLOY.md).
# Doing it here instead keeps the deploy configuration in version control, where
# it is reviewable and moves with the repo.
#
# Needs one secret: CF_DEPLOY_TOKEN, a Cloudflare API token scoped to publishing
# this Worker and nothing else. site/DEPLOY.md lists the exact permissions.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

# Never let two deploys race; the newest push wins.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: refuse to deploy without a token
        run: |
          if [ -z "${{ secrets.CF_DEPLOY_TOKEN }}" ]; then
            echo "CF_DEPLOY_TOKEN is not set — see site/DEPLOY.md for the scopes it needs." >&2
            exit 1
          fi

      - name: deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_TOKEN }}
        run: npx --yes wrangler@4 deploy

      - name: the site answers
        run: |
          set -euo pipefail
          for path in / /docs /zh /zh/docs /lang.js; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
              --retry-all-errors "https://agentstow.dev$path")
            echo "https://agentstow.dev$path -> $code"
            [ "$code" = "200" ] || { echo "expected 200" >&2; exit 1; }
          done
          # A 404 that is served rather than thrown proves not_found_handling works.
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://agentstow.dev/definitely-not-here)
          echo "404 handling -> $code"
          [ "$code" = "404" ] || { echo "expected 404" >&2; exit 1; }
          # A miss under /zh/ must serve the *Chinese* 404 — the nearest-404 walk.
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://agentstow.dev/zh/definitely-not-here)
          echo "zh 404 handling -> $code"
          [ "$code" = "404" ] || { echo "expected 404" >&2; exit 1; }
          curl -sS https://agentstow.dev/zh/definitely-not-here | grep -q 'lang="zh' \
            || { echo "zh 404 not served for a /zh/* miss" >&2; exit 1; }
