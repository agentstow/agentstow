[package]
name = "agentstow"
version = "0.0.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "GNU Stow for your AI coding agents — sync skills, instructions, MCP, commands, subagents and hooks from one canonical store"
repository = "https://github.com/agentstow/agentstow"
readme = "README.md"
keywords = ["ai-agents", "claude-code", "codex", "skills", "symlink"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
