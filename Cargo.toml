[package]
name = "agentstow"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "GNU Stow for your AI coding agents — sync skills, instructions, MCP, commands, subagents and hooks from one canonical store"
repository = "https://github.com/agentstow/agentstow"
readme = "README.md"
keywords = ["ai-agents", "claude-code", "codex", "skills", "symlink"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
toml_edit = "0.25.5"

[dev-dependencies]
tempfile = "3"
libc = "0.2"
toml = "1.1.4"

[profile.release]
strip = true
lto = true
